<!--
    Karaoke Mobile Remote Interface

    This file represents the mobile client interface for the Karaoke system.
    It allows users to search songs via YouTube, select tracks, and add them
    to the live singing queue.

    Core Responsibilities:
    - Provide a mobile-friendly UI for song search and selection
    - Handle user identity via localStorage (singer name persistence)
    - Communicate with backend APIs (/api/songs, /api/live-queue)
    - Display search results dynamically
    - Submit selected songs to the shared queue

    Key Features:
    - YouTube-based song search integration
    - Real-time queue participation via API
    - Persistent user identity (localStorage)
    - Error handling with user-friendly messages

    Acts as:
    - Frontend client (mobile interface)
    - API consumer (Flask backend)
    - UI layer for queue interaction

    Author: GM Mercullo
    Project: GM's Karaoke System
-->
<!DOCTYPE html>
<html>
<head>
<title>KTVs Karaoke Remote</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body { background: #080808; color: white; font-family: 'Outfit', sans-serif; padding: 20px; }
.search-box { display: flex; gap: 8px; margin-bottom: 4px; }
.search-status { min-height: 24px; color: #4169E1; font-size: 0.9em; padding: 4px 2px 10px; }
input { flex: 1; padding: 12px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 6px; }
button { background: #4169E1; color: white; padding: 12px 20px; border: none; border-radius: 6px; font-weight: bold; }
.result-item { display: flex; align-items: center; gap: 12px; background: #121212; padding: 10px; border: 1px solid #222; border-radius: 8px; margin-bottom: 10px; text-align: left; }
.result-item img { width: 60px; border-radius: 4px; }
.user-bar { font-size: 0.9em; color: #888; margin-bottom: 20px; }
.change-btn { background: none; border: none; color: #4169E1; text-decoration: underline; padding: 0; margin-left: 10px; cursor: pointer; font-family: inherit; }
.name-input { width: 100%; margin: 8px 0 16px; }
</style>
</head>
<body>
<h2 style="color:#4169E1; margin-bottom: 5px;">KTVs REMOTE</h2>

<div class="user-bar">
    Singing as: <span id="singerDisplay" style="color: white; font-weight: bold;">Guest</span>
    <input class="name-input" type="text" id="singerName" maxlength="100" placeholder="Enter your name to request a song">
</div>

<div class="search-box">
<input type="text" id="songQuery" placeholder="Search song or artist...">
<button onclick="searchSongs()">SEARCH</button>
</div>
<div id="searchStatus" class="search-status" role="status" aria-live="polite"></div>
<div id="results"></div>

<script>
    const roomId = {{ room_id|tojson }};
    let scoringEnabled = true;
    let queueSubmissionInProgress = false;

    window.onload = () => {
        const savedName = localStorage.getItem('karaoke_name');
        if (savedName) {
            document.getElementById('singerDisplay').textContent = savedName;
            document.getElementById('singerName').value = savedName;
        }
        fetch(`/api/config?room_id=${encodeURIComponent(roomId)}`, { credentials: 'same-origin' })
            .then((response) => response.ok ? response.json() : null)
            .then((config) => {
                if (config && typeof config.scoring_enabled === 'boolean') {
                    scoringEnabled = config.scoring_enabled;
                    document.getElementById('singerName').hidden = !scoringEnabled;
                }
            })
            .catch(() => {});
    };

    function getSingerName() {
        if (!scoringEnabled) return 'Guest';
        const nameInput = document.getElementById('singerName');
        const name = nameInput.value.trim();
        if (!name) {
            setStatus('Enter your name before requesting a song.', true);
            nameInput.focus();
            return null;
        }
        localStorage.setItem('karaoke_name', name);
        document.getElementById('singerDisplay').textContent = name;
        return name;
    }


    function setStatus(message, isError = false) {
        const resultsDiv = document.getElementById('results');
        if (!resultsDiv) return;

        resultsDiv.replaceChildren();
        const status = document.createElement('div');
        status.style.color = isError ? '#ff4060' : '#00e5b0';
        status.textContent = message;
        resultsDiv.appendChild(status);
    }

    function getFriendlyError(error) {
        if (error instanceof TypeError) {
            return "Cannot reach the karaoke server. Check your connection.";
        }
        return error.message || "Request failed";
    }

    async function searchSongs() {
        const query = document.getElementById('songQuery').value.trim();
        const resultsDiv = document.getElementById('results');
        const searchStatus = document.getElementById('searchStatus');
        if (!query) return;

        resultsDiv.replaceChildren();
        searchStatus.textContent = 'Searching...';
        const loading = document.createElement('div');
        loading.style.color = '#4169E1';
        resultsDiv.appendChild(loading);

        try {
            const response = await fetch(`/api/search?q=${encodeURIComponent(query)}&room_id=${encodeURIComponent(roomId)}`, {
                credentials: 'same-origin'
            });

            if (!response.ok) {
                const data = await response.json().catch(() => ({}));
                throw new Error(data.error || 'Song catalog unavailable');
            }

            const data = (await response.json()).map((song) => ({
                id: song.id || song.youtube_id,
                title: song.title || 'Untitled song',
                thumbnail: song.thumbnail || (
                    song.youtube_id
                        ? `https://i.ytimg.com/vi/${encodeURIComponent(song.youtube_id)}/mqdefault.jpg`
                        : ''
                )
            })).filter((song) => song.id);
            resultsDiv.replaceChildren();
            searchStatus.textContent = '';

            if (data.length === 0) {
                const empty = document.createElement('div');
                empty.style.color = '#888';
                empty.textContent = 'No songs found.';
                resultsDiv.appendChild(empty);
                return;
            }

            data.forEach(video => {
                const div = document.createElement('div');
                div.className = 'result-item';
                div.onclick = () => addToQueue(video.id, video.title);

                const img = document.createElement('img');
                img.src = video.thumbnail || '';
                img.alt = video.title || 'Song thumbnail';

                const titleDiv = document.createElement('div');
                titleDiv.textContent = video.title || 'Untitled song';

                div.appendChild(img);
                div.appendChild(titleDiv);
                resultsDiv.appendChild(div);
            });
        } catch (e) {
            console.error("Search Error:", e);
            searchStatus.textContent = '';
            setStatus(getFriendlyError(e), true);
        }
    }

    async function addToQueue(videoId, title) {
        if (queueSubmissionInProgress) return;
        const name = getSingerName();
        if (!name) return;

        queueSubmissionInProgress = true;
        try {
            const response = await fetch('/api/live-queue', {
                method: 'POST',
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    youtube_id: videoId,
                    title: title,
                    singer_name: name,
                    room_id: roomId
                })
            });

            const data = await response.json().catch(() => ({}));
            if (!response.ok) {
                throw new Error(data.error || 'Failed to add to queue');
            }

            setStatus('Added to queue!');
            document.getElementById('results').replaceChildren();
            document.getElementById('songQuery').value = '';
        } catch (error) {
            setStatus('Error: ' + getFriendlyError(error), true);
        } finally {
            queueSubmissionInProgress = false;
        }
    }
</script>
</body>
</html>
