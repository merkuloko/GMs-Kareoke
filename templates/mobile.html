<!--
    Karaoke Mobile Remote Interface

    This file represents the mobile client interface for the Karaoke system.
    It allows users to search songs via YouTube, select tracks, and add them
    to the live singing queue.

    Core Responsibilities:
    - Provide a mobile-friendly UI for song search and selection
    - Handle user identity via localStorage (singer name persistence)
    - Communicate with backend APIs (/api/songs, /api/live-queue)
    - Display search results dynamically
    - Submit selected songs to the shared queue

    Key Features:
    - YouTube-based song search integration
    - Real-time queue participation via API
    - Persistent user identity (localStorage)
    - Error handling with user-friendly messages

    Acts as:
    - Frontend client (mobile interface)
    - API consumer (Flask backend)
    - UI layer for queue interaction

    Author: GM Mercullo
    Project: GM's Karaoke System
-->
<!DOCTYPE html>
<html>
<head>
<title>GM's Kareoke — Guest Queue</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root {
    color-scheme: dark;
    --bg: #05070b;
    --panel: rgba(18, 18, 18, 0.86);
    --panel-hover: #1e1e1e;
    --text: #f7f7f7;
    --muted: #9ca3af;
    --accent: #7dd3fc;
    --accent-strong: #38bdf8;
    --danger: #fb7185;
}
* { box-sizing: border-box; }
body {
    min-height: 100vh;
    margin: 0;
    padding: 24px 16px 48px;
    color: var(--text);
    background:
        radial-gradient(circle at top, rgba(56, 189, 248, 0.14), transparent 34rem),
        var(--bg);
    font-family: 'Outfit', system-ui, sans-serif;
}
.mobile-shell { width: min(100%, 560px); margin: 0 auto; }
.brand { margin: 8px 0 24px; }
.brand span { color: var(--accent); font-size: 0.75rem; letter-spacing: .18em; text-transform: uppercase; }
.brand h1 { margin: 6px 0 0; font-size: clamp(1.8rem, 8vw, 2.5rem); letter-spacing: -.04em; }
.user-bar {
    margin-bottom: 18px;
    padding: 14px 16px;
    border: 1px solid rgba(148, 163, 184, .14);
    border-radius: 18px;
    background: rgba(18, 18, 18, .72);
    color: var(--muted);
}
.name-input { width: 100%; margin-top: 10px; }
.search-panel {
    position: sticky;
    top: 0;
    z-index: 2;
    padding: 12px 0 10px;
    background: linear-gradient(var(--bg) 75%, transparent);
    backdrop-filter: blur(14px);
}
.search-box { display: flex; gap: 8px; }
input {
    min-width: 0;
    flex: 1;
    padding: 15px 16px;
    border: 1px solid rgba(148, 163, 184, .2);
    border-radius: 16px;
    outline: none;
    background: rgba(18, 18, 18, .92);
    color: var(--text);
    font-size: 1rem;
}
input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56, 189, 248, .14); }
button {
    border: 0;
    border-radius: 14px;
    background: var(--accent-strong);
    color: #061018;
    cursor: pointer;
    font-weight: 600;
}
.search-button { min-width: 92px; padding: 0 16px; }
.search-status {
    min-height: 30px;
    padding: 8px 4px 2px;
    color: var(--accent);
    font-size: .85rem;
}
.result-item {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    margin: 10px 0;
    padding: 12px;
    border: 1px solid rgba(148, 163, 184, .1);
    border-radius: 18px;
    background: var(--panel);
    text-align: left;
    transition: background .15s ease, transform .15s ease;
}
.result-item:hover { background: var(--panel-hover); transform: translateY(-1px); }
.result-item img { width: 68px; height: 48px; flex: 0 0 auto; border-radius: 10px; object-fit: cover; background: #222; }
.result-item > div { min-width: 0; flex: 1; overflow-wrap: anywhere; }
.queue-button { padding: 10px 14px; font-size: .9rem; }
.change-btn { margin-left: 8px; padding: 0; color: var(--accent); background: transparent; text-decoration: underline; }
.empty-state { padding: 24px 4px; color: var(--muted); text-align: center; }
@media (max-width: 420px) {
    body { padding-inline: 12px; }
    .search-box { flex-direction: column; }
    .search-button { min-height: 48px; }
}
</style>
</head>
<body>
<main class="mobile-shell">
<header class="brand"><span>GM's Kareoke</span><h1>Request a song</h1></header>
<div class="user-bar">
    Singing as: <span id="singerDisplay" style="color: white; font-weight: bold;">Guest</span>
    <input class="name-input" type="text" id="singerName" maxlength="100" placeholder="Enter your name to request a song">
</div>

<section class="search-panel" aria-label="Song search">
    <div class="search-box">
        <input type="search" id="songQuery" placeholder="Search songs or artists..." autocomplete="off">
        <button class="search-button" type="button" onclick="searchSongs()">Search</button>
    </div>
    <div id="searchStatus" class="search-status" role="status" aria-live="polite"></div>
</section>
<div id="results"></div>
</main>

<script>
    let scoringEnabled = true;
    let queueSubmissionInProgress = false;

    window.onload = () => {
        const savedName = localStorage.getItem('karaoke_name');
        if (savedName) {
            document.getElementById('singerDisplay').textContent = savedName;
            document.getElementById('singerName').value = savedName;
        }
        fetch('/api/config', { credentials: 'same-origin' })
            .then((response) => response.ok ? response.json() : null)
            .then((config) => {
                if (config && typeof config.scoring_enabled === 'boolean') {
                    scoringEnabled = config.scoring_enabled;
                    document.getElementById('singerName').hidden = !scoringEnabled;
                }
            })
            .catch(() => {});
    };

    function getSingerName() {
        if (!scoringEnabled) return 'Guest';
        const nameInput = document.getElementById('singerName');
        const name = nameInput.value.trim();
        if (!name) {
            setStatus('Enter your name before requesting a song.', true);
            nameInput.focus();
            return null;
        }
        localStorage.setItem('karaoke_name', name);
        document.getElementById('singerDisplay').textContent = name;
        return name;
    }
    // ----------------------------------

    function setStatus(message, isError = false) {
        const resultsDiv = document.getElementById('results');
        if (!resultsDiv) return;

        resultsDiv.innerHTML = '';
        const status = document.createElement('div');
        status.style.color = isError ? '#ff4060' : '#00e5b0';
        status.textContent = message;
        resultsDiv.appendChild(status);
    }

    function getFriendlyError(error) {
        if (error instanceof TypeError) {
            return "Cannot reach the karaoke server. Check your connection.";
        }
        return error.message || "Request failed";
    }

    async function searchSongs() {
        const query = document.getElementById('songQuery').value.trim();
        const resultsDiv = document.getElementById('results');
        const searchStatus = document.getElementById('searchStatus');
        if (!query) return;

        resultsDiv.replaceChildren();
        searchStatus.textContent = 'Searching...';
        const loading = document.createElement('div');
        loading.style.color = '#4169E1';
        resultsDiv.appendChild(loading);

        try {
            const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`, {
                credentials: 'same-origin'
            });

            if (!response.ok) {
                const data = await response.json().catch(() => ({}));
                throw new Error(data.error || 'Song catalog unavailable');
            }

            const data = (await response.json()).map((song) => ({
                id: song.id || song.youtube_id,
                title: song.title || 'Untitled song',
                thumbnail: song.thumbnail || (
                    song.youtube_id
                        ? `https://i.ytimg.com/vi/${encodeURIComponent(song.youtube_id)}/mqdefault.jpg`
                        : ''
                )
            })).filter((song) => song.id);
            resultsDiv.replaceChildren();
            searchStatus.textContent = '';

            if (data.length === 0) {
                const empty = document.createElement('div');
                empty.style.color = '#888';
                empty.textContent = 'No songs found.';
                resultsDiv.appendChild(empty);
                return;
            }

            data.forEach(video => {
                const div = document.createElement('div');
                div.className = 'result-item';
                div.onclick = () => addToQueue(video.id, video.title);

                const img = document.createElement('img');
                img.src = video.thumbnail || '';
                img.alt = video.title || 'Song thumbnail';

                const titleDiv = document.createElement('div');
                titleDiv.textContent = video.title || 'Untitled song';

                const addButton = document.createElement('button');
                addButton.className = 'queue-button';
                addButton.type = 'button';
                addButton.setAttribute('aria-label', `Add ${video.title || 'song'} to queue`);
                addButton.textContent = '+';
                addButton.onclick = (event) => {
                    event.stopPropagation();
                    addToQueue(video.id, video.title);
                };

                div.appendChild(img);
                div.appendChild(titleDiv);
                div.appendChild(addButton);
                resultsDiv.appendChild(div);
            });
        } catch (e) {
            console.error("Search Error:", e);
            searchStatus.textContent = '';
            setStatus(getFriendlyError(e), true);
        }
    }

    async function addToQueue(videoId, title) {
        if (queueSubmissionInProgress) return;
        const name = getSingerName();
        if (!name) return;

        queueSubmissionInProgress = true;
        try {
            const response = await fetch('/api/live-queue', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    youtube_id: videoId,
                    title: title,
                    singer_name: name
                })
            });

            const data = await response.json().catch(() => ({}));
            if (!response.ok) {
                throw new Error(data.error || 'Failed to add to queue');
            }

            setStatus('Added to queue!');
            document.getElementById('results').replaceChildren();
            document.getElementById('songQuery').value = '';
        } catch (error) {
            setStatus('Error: ' + getFriendlyError(error), true);
        } finally {
            queueSubmissionInProgress = false;
        }
    }
</script>
</body>
</html>
